<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FX Signal Generator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header>
    <h1>FX Signal Generator</h1>
    <p class="sub">Live FX data from Yahoo Finance &middot; SMA crossover + RSI signals</p>
  </header>

  <section class="controls">
    <label>
      Pairs
      <select id="pairs" multiple size="6">
        <option value="EURUSD=X" selected>EUR/USD</option>
        <option value="GBPUSD=X" selected>GBP/USD</option>
        <option value="USDJPY=X" selected>USD/JPY</option>
        <option value="AUDUSD=X">AUD/USD</option>
        <option value="USDCAD=X">USD/CAD</option>
        <option value="USDCHF=X">USD/CHF</option>
        <option value="NZDUSD=X">NZD/USD</option>
        <option value="EURGBP=X">EUR/GBP</option>
        <option value="EURJPY=X">EUR/JPY</option>
        <option value="GBPJPY=X">GBP/JPY</option>
      </select>
      <span class="hint">Ctrl/Cmd-click for multiple</span>
    </label>

    <label>
      Interval
      <select id="interval">
        <option value="1d" selected>1 day</option>
        <option value="1h">1 hour</option>
        <option value="60m">60 min</option>
        <option value="30m">30 min</option>
        <option value="15m">15 min</option>
      </select>
    </label>

    <label>
      Range
      <select id="range">
        <option value="1mo">1 month</option>
        <option value="3mo" selected>3 months</option>
        <option value="6mo">6 months</option>
        <option value="1y">1 year</option>
        <option value="2y">2 years</option>
      </select>
    </label>

    <label>
      Fast SMA
      <input id="fastSma" type="number" min="2" max="200" value="20" />
    </label>

    <label>
      Slow SMA
      <input id="slowSma" type="number" min="3" max="400" value="50" />
    </label>

    <label>
      RSI period
      <input id="rsiPeriod" type="number" min="2" max="100" value="14" />
    </label>

    <button id="runBtn">Generate signals</button>
  </section>

  <section id="status" class="status"></section>

  <section id="results" class="results"></section>

  <footer>
    <small>
      Data: Yahoo Finance via public CORS proxy. For informational purposes only &mdash; not financial advice.
    </small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
